<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    .slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;      /* "cover" füllt den Bildschirm, schneidet aber zu */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slide.active { opacity: 1; }
  </style>
</head>
<body>
  <script>
    // Hier alle Fotos eintragen
    const fotos = [
      "fotos/01.jpg",
      "fotos/02.jpg",
      "fotos/03.jpg"
    ];
    const dauer = 5000; // Anzeigedauer pro Foto in ms

    const slides = fotos.map((src, i) => {
      const img = document.createElement("img");
      img.src = src;
      img.className = "slide" + (i === 0 ? " active" : "");
      document.body.appendChild(img);
      return img;
    });

    let aktuell = 0;
    setInterval(() => {
      slides[aktuell].classList.remove("active");
      aktuell = (aktuell + 1) % slides.length;
      slides[aktuell].classList.add("active");
    }, dauer);
  </script>
</body>
</html>
