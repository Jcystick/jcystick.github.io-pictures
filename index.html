<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    .slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;      /* "cover" füllt den Bildschirm, schneidet aber zu */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slide.active { opacity: 1; }
  </style>
</head>
<body>
  <script>
    const anzahl = 253;   // <-- Anzahl deiner Fotos eintragen
    const dauer = 7000;  // Anzeigedauer pro Foto in ms

    const slides = [];
    for (let i = 1; i <= anzahl; i++) {
      const img = document.createElement("img");
      img.src = encodeURIComponent("1 (" + i + ").jpg");
      img.className = "slide" + (i === 1 ? " active" : "");
      document.body.appendChild(img);
      slides.push(img);
    }

    let aktuell = 0;
    setInterval(() => {
      slides[aktuell].classList.remove("active");
      aktuell = (aktuell + 1) % slides.length;
      slides[aktuell].classList.add("active");
    }, dauer);
  </script>
</body>
</html>
